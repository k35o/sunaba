packages:
  - packages/*
  - examples/*

catalog:
  "@k8o/oxc-config": 0.3.0
  "@types/node": 26.5.1
  typescript: 6.0.3
  vite-plus: 0.3.2

blockExoticSubdeps: true

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@k8o/*"

strictDepBuilds: true

allowBuilds:
  esbuild: false

verifyDepsBeforeRun: install

saveExact: true
autoInstallPeers: false

versioning:
  changelog:
    storage: repository
