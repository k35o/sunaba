packages:
  - packages/*
  - examples/*

catalog:
  "@k8o/oxc-config": 0.1.3
  "@types/node": 26.1.1
  typescript: 6.0.3
  vite-plus: 0.2.4
  react: 19.2.8
  react-dom: 19.2.8
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  vite: 8.2.1

blockExoticSubdeps: true

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@k8o/*"

strictDepBuilds: true

allowBuilds:
  esbuild: false

verifyDepsBeforeRun: install

saveExact: true
autoInstallPeers: false

versioning:
  changelog:
    storage: repository
