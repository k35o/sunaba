packages:
  - packages/*
  - examples/*

catalog:
  "@k8o/oxc-config": 0.4.0
  "@types/node": 26.6.5
  typescript: 6.0.3
  vite-plus: 1.1.0

blockExoticSubdeps: true

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@k8o/*"
  # Renovate security update: vite-plus@1.1.0
  - vite-plus@1.1.0

strictDepBuilds: true

allowBuilds:
  esbuild: false

verifyDepsBeforeRun: install

saveExact: true
autoInstallPeers: false

versioning:
  changelog:
    storage: repository
